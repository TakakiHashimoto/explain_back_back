name: Due Review Reminders

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: explain-it-back-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      NOTIFICATION_DRY_RUN: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: bunx prisma generate --config prisma7.config.ts

      - name: Run notification worker
        working-directory: apps/backend
        run: bun scripts/run-due-review-reminders.ts
